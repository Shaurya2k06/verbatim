[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
ffi = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "./vectors" }, { access = "read-write", path = "./.state" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 40
fail_on_revert = false
