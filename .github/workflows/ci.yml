name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: Contracts
        working-directory: contracts
        run: forge test
      - name: TypeScript packages
        run: pnpm -r --if-present test
      - name: Differential fuzz (I8), at least 10k cases
        working-directory: contracts/scripts/difffuzz
        run: pnpm exec tsx src/fuzz.ts 10000 "$GITHUB_RUN_NUMBER"
      - name: URRender package matches the contract sources
        run: |
          cmp contracts/src/lib/VTree.sol packages/urrender/solidity/VTree.sol
          cmp contracts/src/uniswap/HookFlags.sol packages/urrender/solidity/HookFlags.sol
          sed 's#"../lib/VTree.sol"#"./VTree.sol"#' contracts/src/uniswap/URRender.sol | cmp - packages/urrender/solidity/URRender.sol
      - name: frame-tools matches the contract's FrameReader
        run: cmp contracts/src/lib/FrameReader.yul packages/frame-tools/yul/FrameReader.yul
      - name: Exactly one LOG1 in the account and paymaster, no DELEGATECALL in the account
        working-directory: contracts/scripts/live
        run: npx tsx check-bytecode.ts
