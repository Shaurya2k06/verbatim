name: urrender
on:
  push:
    paths: ["packages/urrender/**", "contracts/src/uniswap/**", "contracts/src/lib/VTree.sol", ".github/workflows/urrender.yml"]
  pull_request:
    paths: ["packages/urrender/**", "contracts/src/uniswap/**", "contracts/src/lib/VTree.sol", ".github/workflows/urrender.yml"]
jobs:
  urrender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: TypeScript tests
        run: pnpm --filter @verbatim/urrender test
      - name: Solidity tests
        working-directory: contracts
        run: forge test --match-contract URRender
      - name: Package sources match the contracts
        run: |
          cmp contracts/src/lib/VTree.sol packages/urrender/solidity/VTree.sol
          cmp contracts/src/uniswap/HookFlags.sol packages/urrender/solidity/HookFlags.sol
          sed 's#"../lib/VTree.sol"#"./VTree.sol"#' contracts/src/uniswap/URRender.sol | cmp - packages/urrender/solidity/URRender.sol
