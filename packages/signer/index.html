<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <title>Verbatim Signer</title>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg class="mark" width="22" height="22" viewBox="-1 -1 10 10" aria-hidden="true">

          <rect x="1" y="2" width="1" height="1" /><rect x="6" y="2" width="1" height="1" />

          <rect x="3" y="6" width="2" height="1" /><rect x="3" y="7" width="2" height="1" />
        </svg>
        <h1>Verbatim Signer</h1>
      </div>
      <p class="eyebrow">// offline device</p>
      <p class="sub">Offline. Shows every line of what you sign. Turn on airplane mode.</p>

    </main>
    <script type="module" src="/src/main.ts"></script>
