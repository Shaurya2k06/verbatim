<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbatim Signer</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f5f1; --ink: #17181a; --mute: #63666b; --line: #d8d6cf; --risk: #b3261e; --riskbg: #fbe9e7; --ok: #1b6e3c; --panel: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111214; --ink: #eceded; --mute: #9a9da3; --line: #2c2e32; --risk: #ff8a80; --riskbg: #33191a; --ok: #6fcf97; --panel: #191a1d; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 18px; margin: 0 0 2px; }
      .sub { color: var(--mute); font-size: 13px; margin-bottom: 16px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
      .line { font-size: 15px; padding: 3px 0; overflow-wrap: anywhere; }
      .risk { color: var(--risk); background: var(--riskbg); font-weight: 650; padding: 8px 10px; border-radius: 7px; margin-bottom: 6px; }
      textarea, input { width: 100%; font: 13px ui-monospace, monospace; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
      textarea { min-height: 72px; }
      button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
      button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .err { color: var(--risk); font-weight: 600; margin-top: 8px; overflow-wrap: anywhere; }
      .mono { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; color: var(--mute); }
      video, canvas { max-width: 100%; border-radius: 8px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Verbatim Signer</h1>
      <div class="sub">Offline. Shows every line of what you sign. Turn on airplane mode.</div>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
